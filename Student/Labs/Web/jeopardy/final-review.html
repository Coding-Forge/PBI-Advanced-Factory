<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeopardy Final Review - Power BI Advanced Factory</title>
  <script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
  <script src="../scripts/delivery-brand.js" defer></script>
  <style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.55; }
a { color: var(--cp-link); }
button, input { font: inherit; }
  </style>
  <link rel="stylesheet" href="jeopardy.css">
  <style>
    /* Final review board has up to 11 categories - allow horizontal scroll and slightly narrower tiles */
    .jp-board-inner { min-width: 1600px; }
    .jp-delivery-toggle { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 12px; }
    .jp-delivery-label { font-weight: 700; color: var(--cp-text-muted); }
  </style>
</head>
<body>
  <div class="jp-shell">
    <nav class="jp-topbar">
      <a href="../index.html">&larr; Course home</a>
      <a href="index.html">All Jeopardy boards</a>
    </nav>
    <div class="jp-delivery-toggle" id="jp-delivery-toggle">
      <span class="jp-delivery-label">Delivery length:</span>
      <button class="jp-btn" id="jp-delivery-3" data-days="3">1-Day / 3-Day (Labs 1-7)</button>
      <button class="jp-btn" id="jp-delivery-5" data-days="5">5-Day (All 11 modules)</button>
    </div>
    <div id="jeopardy-root"><p>Loading board...</p></div>
    <div class="jp-overlay" id="jp-overlay" hidden></div>
  </div>
  <script src="data/final-review.js"></script>
  <script>
  (() => {
    const storageKey = "pbi-advanced-factory:jeopardy:final-review:deliveryMode";
    const params = new URLSearchParams(window.location.search);
    const fromParam = params.get("delivery");
    let mode = (fromParam === "3" || fromParam === "5") ? fromParam : (localStorage.getItem(storageKey) || "5");
    if (mode !== "3" && mode !== "5") mode = "5";
    localStorage.setItem(storageKey, mode);

    const data = window.JEOPARDY_DATA;
    const fullCategories = data.categories;
    if (mode === "3") {
      data.categories = fullCategories.slice(0, 7);
      data.title = "Final Review: Power BI Advanced Factory (1-Day / 3-Day Delivery, Labs 1-7)";
      data.boardId = "final-review-3day";
    } else {
      data.title = "Final Review: Power BI Advanced Factory (5-Day Delivery, All 11 Modules)";
      data.boardId = "final-review-5day";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const btn3 = document.getElementById("jp-delivery-3");
      const btn5 = document.getElementById("jp-delivery-5");
      (mode === "3" ? btn3 : btn5).classList.add("jp-btn--primary");
      [btn3, btn5].forEach(btn => {
        btn.addEventListener("click", () => {
          if (btn.dataset.days === mode) return;
          localStorage.setItem(storageKey, btn.dataset.days);
          const url = new URL(window.location.href);
          url.searchParams.set("delivery", btn.dataset.days);
          window.location.href = url.toString();
        });
      });
    });
  })();
</script>
  <script src="jeopardy.js"></script>
</body>
</html>
